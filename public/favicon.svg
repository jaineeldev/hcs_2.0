<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Hawthorne Corner Store — "HC" monogram, remastered 2026-11-24.
       Grid: cap line y=10, baseline y=22, centre line y=16, side margins x=6.25 / 25.75.
       H stems and C stroke are 2.8 wide; crossbar 2.4 sits on the C's centre line.
       C overshoots the cap/baseline by 0.15 (optical correction for round letters)
       and its ends are cut vertically by the clip at x=25.75. -->
  <defs>
    <clipPath id="c-cut"><rect x="0" y="0" width="25.75" height="32"/></clipPath>
  </defs>

  <!-- Crimson tile -->
  <rect width="32" height="32" rx="6" fill="#7A1525"/>

  <!-- Inner hairline -->
  <rect x="2.4" y="2.4" width="27.2" height="27.2" rx="4" fill="none" stroke="#F6EBD2" stroke-opacity="0.55" stroke-width="0.7"/>

  <!-- Diamond ornament, top centre -->
  <rect x="14.9" y="5.8" width="2.2" height="2.2" fill="#F6EBD2" transform="rotate(45 16 6.9)"/>

  <!-- H -->
  <rect x="6.25" y="10" width="2.8" height="12" fill="#F6EBD2"/>
  <rect x="12.45" y="10" width="2.8" height="12" fill="#F6EBD2"/>
  <rect x="6.25" y="14.8" width="9" height="2.4" fill="#F6EBD2"/>

  <!-- C -->
  <path clip-path="url(#c-cut)" d="M 27.11 13.625 A 4.75 4.75 0 1 0 27.11 18.375" fill="none" stroke="#F6EBD2" stroke-width="2.8"/>
</svg>
